# Replace __VM_IP__ with the external IP of your GCP VM in BOTH places below.
services:
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SQLITE_PATH: /data/database.sqlite
      CORS_ORIGIN: "http://__VM_IP__,http://localhost,http://127.0.0.1,http://localhost:5173"
    volumes:
      - backend-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://__VM_IP__:3000"
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
